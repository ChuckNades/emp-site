# T11 bypass lane. GitHub `on.push.paths` triggers when ANY changed file
# matches, but the ratified bypass requires EVERY changed file to be a content
# path. So this workflow triggers on ALL dev pushes (and PRs into main), then
# its single job FIRST runs a changed-paths check and SKIPS (exits success,
# running nothing else) unless every changed path is ratified content/media
# (src/content/** or src/assets/content/**). Brand assets
# (src/assets/brand/**) are NOT bypass paths and take the full ci.yml gate.
# Ratified media bypass — validate-only: build + schema validation (test:t2).
name: content

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: build + schema validation only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Decide the lane: content-only iff EVERY changed path is under
      # src/content/** or src/assets/content/**. Exits 1 (skipping the rest)
      # when the push is not content-only — ci.yml takes those.
      # Safe default: any guard-mechanics failure (missing/zero before SHA,
      # shallow clone, any git error) resolves to NOT content-only — the
      # bypass SKIPS — with a logged notice. The guard never fails the job
      # on its own mechanics.
      - name: changed-paths check (content-only?)
        id: gate
        run: |
          set -uo pipefail
          changed=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            RANGE="$BASE..${{ github.sha }}"
          else
            BASE="${{ github.event.before }}"
            # A brand-new branch / force push can carry an all-zero or empty
            # before SHA; diff against the empty tree so every file in the
            # push counts as changed.
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "changed-paths: notice — missing/zero before SHA; diffing against the empty tree"
              RANGE="4b825dc642cb6eb9a060e54bf8d69288fbee4904 ${{ github.sha }}"
            else
              RANGE="$BASE..${{ github.sha }}"
            fi
          fi
          if ! changed="$(git diff --name-only $RANGE 2>&1)"; then
            echo "changed-paths: notice — git diff failed ($changed); defaulting to NOT content-only"
            changed=""
          fi
          if [ -z "$changed" ]; then
            echo "changed-paths: no changed files (or guard defaulted safe) — not content-only"
            exit 1
          fi
          echo "changed-paths: changed files:"
          echo "$changed"
          # Any changed path OUTSIDE the ratified content roots -> not content-only.
          if echo "$changed" | grep -qv -e '^src/content/' -e '^src/assets/content/'; then
            echo "changed-paths: non-content path present — not content-only (ci.yml takes this push)"
            exit 1
          fi
          echo "changed-paths: every changed path is content — running validate-only bypass"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      - name: test:t2
        run: npm run test:t2
