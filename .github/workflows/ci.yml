# T11: full CI gate battery. Runs on every push to dev and every PR into
# main, EXCEPT when every changed path is ratified content/media
# (src/content/**, src/assets/content/**) — those take the validate-only
# bypass lane in content.yml instead. GitHub `paths-ignore` triggers when ANY
# changed file is not ignored, which is the wrong polarity for the ratified
# all-match rule, so the battery decides by the SAME changed-paths check
# content.yml uses and SKIPS (exits success, running nothing else) when the
# push is content-only. The two lanes are mutually exclusive by commit.
name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: build + full test battery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Inverse of content.yml: skip the battery when EVERY changed path is
      # ratified content/media (that push takes the validate-only bypass).
      # Safe default: any guard-mechanics failure (missing/zero before SHA,
      # shallow clone, any git error) resolves to NOT content-only — the
      # battery RUNS — with a logged notice. The guard never fails the job
      # on its own mechanics.
      - name: changed-paths check (skip when content-only)
        id: gate
        run: |
          set -uo pipefail
          changed=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            RANGE="$BASE..${{ github.sha }}"
          else
            BASE="${{ github.event.before }}"
            # A brand-new branch / force push can carry an all-zero or empty
            # before SHA; diff against the empty tree so every file in the
            # push counts as changed.
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "changed-paths: notice — missing/zero before SHA; diffing against the empty tree"
              RANGE="4b825dc642cb6eb9a060e54bf8d69288fbee4904 ${{ github.sha }}"
            else
              RANGE="$BASE..${{ github.sha }}"
            fi
          fi
          if ! changed="$(git diff --name-only $RANGE 2>&1)"; then
            echo "changed-paths: notice — git diff failed ($changed); defaulting to NOT content-only"
            changed=""
          fi
          if [ -n "$changed" ] && ! echo "$changed" | grep -qv -e '^src/content/' -e '^src/assets/content/'; then
            echo "changed-paths: content-only push — skipping the full battery (content.yml takes this push)"
            exit 1
          fi
          echo "changed-paths: non-content path present (or guard defaulted safe) — running the full battery"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: install playwright chromium
        run: npx playwright install --with-deps chromium

      - name: build
        run: npm run build

      - name: test:jsonld
        run: npm run test:jsonld

      - name: test:t2
        run: npm run test:t2

      - name: test:t4
        run: npm run test:t4

      - name: test:t5
        run: npm run test:t5

      - name: test:t6
        run: npm run test:t6

      - name: test:t7
        run: npm run test:t7

      - name: test:t8
        run: npm run test:t8

      - name: test:t9
        run: npm run test:t9

      - name: test:t10
        run: npm run test:t10
        env:
          # R3: median-of-5 + --no-sandbox on shared runners (lighthouserc.cjs).
          LHCI_CI: "1"

      - name: test:t13
        run: npm run test:t13

      - name: test:t15a
        run: npm run test:t15a

      - name: test:t17
        run: npm run test:t17

  # T14: alert stub. Fires only when the gate battery fails. The destination
  # is a Pete-supplied [FILL] — until ALERT_WEBHOOK_URL / ALERT_CHANNEL are
  # configured, the step is a no-op that exits 0. Never invent a destination.
  notify-failure:
    name: notify on failure (stub)
    runs-on: ubuntu-latest
    needs: [gate]
    if: failure()
    steps:
      - name: alert webhook
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_CHANNEL: ${{ vars.ALERT_CHANNEL }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ] || [ -z "$ALERT_CHANNEL" ]; then
            echo "alert stub: no channel configured"
            exit 0
          fi
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"channel\": \"$ALERT_CHANNEL\", \"text\": \"ci.yml gate failed on ${GITHUB_REF} (${GITHUB_SHA})\"}" \
            "$ALERT_WEBHOOK_URL"

  # T16: IndexNow. Wired but dormant: hosting is not ratified, so the job
  # body is a no-op echo stub. The key file public/ed10e79cc5872cd3c6df034fb35a7560.txt
  # is committed and ships in dist/ (asserted by test:t11); the real curl
  # below references that same key and the SITE host (src/config/site.ts).
  notify-indexnow:
    name: ping IndexNow (stub)
    runs-on: ubuntu-latest
    needs: [gate]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: notify IndexNow
        run: |
          echo "indexnow stub: hosting not ratified, no-op"
          # enable at hosting ratification:
          # curl -sf -X POST -H 'Content-Type: application/json' \
          #   -d '{"host": "expertmortgagepro.com", "key": "ed10e79cc5872cd3c6df034fb35a7560", "keyLocation": "https://expertmortgagepro.com/ed10e79cc5872cd3c6df034fb35a7560.txt", "urlList": ["https://expertmortgagepro.com/"]}' \
          #   https://api.indexnow.org/indexnow
